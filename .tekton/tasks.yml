apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  description: Clean the workspace before running the CI tasks.
  workspaces:
    - name: source
  steps:
    - name: remove-old-files
      image: alpine:3.20
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: nose
spec:
  description: Install Python dependencies and run the Nose unit tests.
  workspaces:
    - name: source
  steps:
    - name: run-nose-tests
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        nosetests -v
